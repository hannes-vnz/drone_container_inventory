[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "containerinv"
version = "0.1.0"
description = "Drone-based container inventory: segmentation on the orthophoto, stack height from the surface model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "matplotlib>=3.7",
    "pillow>=10",
]

[project.optional-dependencies]
sam = ["ultralytics>=8.1"]     # Segment Anything fuer segment / segment-points
dev = ["pytest>=8"]

[project.scripts]
containerinv = "containerinv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
